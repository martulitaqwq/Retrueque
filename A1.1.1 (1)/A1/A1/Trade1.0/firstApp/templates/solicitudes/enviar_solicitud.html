{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Solicitar Trade</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Estás a punto de proponer un intercambio. Llena los detalles para que el dueño evalúe tu oferta.</p>
                <form method="post" action="{% url 'crear_solicitud' solicitud.pk %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-outline-secondary">Enviar Solicitud</button>
</form>

<form method="post" action="{% url 'cancelar_solicitud' solicitud.pk %}" class="mt-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-secondary">Cancelar</button>
</form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
