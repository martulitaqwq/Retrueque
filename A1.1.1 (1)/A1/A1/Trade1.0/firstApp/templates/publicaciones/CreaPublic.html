<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar artículo | Retrueque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
    :root {
        --eco-dark-green: #2C5E3B; 
        --eco-light-green: #528265; 
        --eco-sand: #F4F1EA; 
        --eco-accent: #D4A373; 
    }
    
    body {
        background-color: var(--eco-sand) !important;
    }
    
    .navbar-eco {
        background-color: var(--eco-dark-green) !important;
    }
    
    .btn-success {
        background-color: var(--eco-dark-green) !important;
        border-color: var(--eco-dark-green) !important;
    }
    .btn-success:hover {
        background-color: var(--eco-light-green) !important;
        border-color: var(--eco-light-green) !important;
    }
    
    .card {
        border-radius: 9px;
        border: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .card-header.bg-primary, .card-header.bg-success, .card-header.bg-dark {
        background-color: var(--eco-light-green) !important;
        border-radius: 7px 7px 0 0 !important;
        border: none;
    }
    
    .text-success {
        color: var(--eco-dark-green) !important;
    }

    :root {
        --verde: #2d5f3c;
        --verde-oscuro: #1f4429;
        --verde-claro: #e3ece4;
        --crema: #f4f0e8;
        --blanco: #ffffff;
        --texto: #1d2a21;
        --gris: #6b7a6f;
    }
    body { background: var(--crema); color: var(--texto); }

    /* ---------- Tarjeta principal ---------- */
    .publicar {
        background: var(--blanco);
        border: 2px solid var(--verde);
        border-radius: 7px;
        overflow: hidden;
    }

    .panel-imagen {
        background: var(--verde-claro);
        border-right: 2px solid var(--verde);
        padding: 1rem;
        display: flex;
        flex-direction: column;
        min-height: 100%;
    }
    .zona-imagen {
        width: 100%;
        aspect-ratio: 1200 / 1200;   
        border: 2px dashed var(--verde);
        border-radius: 10px;
        background: var(--blanco);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        overflow: hidden;
        position: relative;
        transition: background .15s;
    }
    .zona-imagen:hover, .zona-imagen:focus-within { background: #f9fbf9; }
    .zona-imagen img { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; }
    .zona-imagen .vacio { padding: 1rem; color: var(--verde); }
    .zona-imagen .vacio small { color: var(--gris); }
    .miniaturas { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
    .miniaturas img {
        width: 64px; height: 64px; object-fit: cover;
        border-radius: 8px; border: 2px solid var(--verde); cursor: pointer;
    }
    .miniaturas img.activa { outline: 3px solid var(--verde-oscuro); outline-offset: 2px; }

    /* Columna derecha: formulario */
    .panel-form { padding: 1.75rem; }
    .seccion { padding-top: 1.25rem; margin-top: 1.25rem; border-top: 2px solid var(--verde-claro); }
    .seccion-titulo { font-weight: 700; color: var(--verde); margin-bottom: .75rem; font-size: 1.05rem; }

    .form-control {
        border: 2px solid var(--verde);
        border-radius: 5px;
        background: var(--blanco);
        color: var(--texto);
    }
    .form-control:focus {
        border-color: var(--verde-oscuro);
        box-shadow: 0 0 0 .25rem rgba(45, 95, 60, .2);
    }
    .campo-titulo { font-size: 1.5rem; font-weight: 50; padding: .6rem .9rem; }

    /* ---------- Filtros tipo "chip" (radio buttons) ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips label {
        border: 2px solid var(--verde);
        color: var(--verde);
        background: var(--blanco);
        border-radius: 999px;
        padding: .35rem .95rem;
        font-weight: 600;
        font-size: .92rem;
        cursor: pointer;
        user-select: none;
        transition: background .12s, color .12s;
    }
    .chips label:hover { background: var(--verde-claro); }
    .chips input:checked + label { background: var(--verde); color: #fff; }
    .chips input:focus-visible + label { outline: 3px solid var(--verde-oscuro); outline-offset: 2px; }

    .grupo-categoria + .grupo-categoria { margin-top: 1rem; }
    .grupo-categoria h6 { color: var(--gris); font-size: .85rem; margin-bottom: .4rem; }

    /* ---------- Botones ---------- */
    .btn-verde {
        background: var(--verde); color: #fff;
        border: 2px solid var(--verde);
        border-radius: 10px; font-weight: 700; padding: .65rem 1.5rem;
    }
    .btn-verde:hover { background: var(--verde-oscuro); border-color: var(--verde-oscuro); color: #fff; }
    .btn-contorno {
        background: transparent; color: var(--verde);
        border: 2px solid var(--verde);
        border-radius: 10px; font-weight: 700; padding: .65rem 1.5rem;
    }
    .btn-contorno:hover { background: var(--verde-claro); color: var(--verde); }

    @media (max-width: 100.99px) {
        .panel-imagen { border-right: 0; border-bottom: 2px solid var(--verde); }
        .zona-imagen { min-height: 50px; }
    }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-eco mb-4 shadow-sm">
    <div class="container-xxl px-4 px-lg-5">
        <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">
            <i class="bi bi-recycle"></i> Retrueque
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'inicio' %}">inicio</a></li>  
                <li class="nav-item"><a class="nav-link" href="{% url 'CreaPublic' %}">Publicar Artículo</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'me_solicitudes' %}">Mis Solicitudes</a></li> 
                <li class="nav-item"><a class="nav-link" href="{% url 'impacto_ambiental' %}"><i class="bi bi-tree"></i> Impacto</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <!-- FORMULARIO PRINCIPAL ÚNICO CONECTADO AL CRUD -->
    <form action="{% url 'publicacion_create' %}" method="POST" enctype="multipart/form-data" class="publicar" id="form-publicar">
        {% csrf_token %}
        <div class="row g-0">

            <!-- IZQUIERDA: imagen -->
            <div class="col-md-6 col-lg-7">
                <div class="panel-imagen">
                    <label class="zona-imagen" for="imagenes">
                        <img id="preview" alt="" hidden>
                        <div class="vacio" id="vacio">
                            <div class="fs-1">📷</div>
                            <strong>Agrega fotos de tu artículo</strong><br>
                            <small>Haz clic para elegir hasta 5 imágenes</small>
                        </div>
                    </label>
                    <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple hidden>
                    <div class="miniaturas" id="miniaturas"></div>
                </div>
            </div>

            <!-- DERECHA: datos -->
            <div class="col-md-6 col-lg-5">
                <div class="panel-form">

                    <!-- Título -->
                    <input type="text" name="titulo" class="form-control campo-titulo" placeholder="Título" maxlength="100" required>

                    <!-- 1. ESTADO DEL ARTÍCULO -->
                    <div class="seccion">
                        <div class="seccion-titulo">Estado del artículo</div>
                        <div class="chips">
                            <input type="radio" name="estado" id="e1" value="nuevo" required><label for="e1">Nuevo</label>
                            <input type="radio" name="estado" id="e2" value="como_nuevo"><label for="e2">Como nuevo</label>
                            <input type="radio" name="estado" id="e3" value="poco_usado"><label for="e3">Poco usado</label>
                            <input type="radio" name="estado" id="e4" value="usado"><label for="e4">Usado</label>
                            <input type="radio" name="estado" id="e5" value="muy_usado"><label for="e5">Muy usado</label>
                            <input type="radio" name="estado" id="e6" value="roto"><label for="e6">Roto / para repuestos</label>
                        </div>
                    </div>

                    <!-- 2. DESCRIPCIÓN -->
                    <div class="seccion">
                        <div class="seccion-titulo">Descripción</div>
                        <textarea name="descripcion" class="form-control" rows="5" placeholder="Cuenta detalles: marca, medidas, tiempo de uso, qué buscas a cambio..."></textarea>
                    </div>

                    <!-- 3. CATEGORÍA -->
                    <div class="seccion">
                        <div class="seccion-titulo">Categoría</div>
                        <div class="grupo-categoria">
                            <h6>Artículos</h6>
                            <div class="chips">
                                <input type="radio" name="categoria" id="c1" value="Tecnología" required><label for="c1">Tecnología</label>
                                <input type="radio" name="categoria" id="c2" value="Ropa"><label for="c2">Ropa</label>
                                <input type="radio" name="categoria" id="c3" value="Libros"><label for="c3">Libros</label>
                                <input type="radio" name="categoria" id="c4" value="Accesorios"><label for="c4">Accesorios</label>
                                <input type="radio" name="categoria" id="c5" value="Muebles"><label for="c5">Muebles</label>
                                <input type="radio" name="categoria" id="c6" value="Deportes"><label for="c6">Deportes</label>
                                <input type="radio" name="categoria" id="c7" value="Hogar"><label for="c7">Hogar</label>
                                <input type="radio" name="categoria" id="c8" value="Juguetes"><label for="c8">Juguetes</label>
                                <input type="radio" name="categoria" id="c9" value="Otros"><label for="c9">Otros</label>
                            </div>
                        </div>
                        <div class="grupo-categoria mt-3">
                            <h6>Vehículos</h6>
                            <div class="chips">
                                <input type="radio" name="categoria" id="v1" value="Autos"><label for="v1">Autos</label>
                                <input type="radio" name="categoria" id="v2" value="Motos"><label for="v2">Motos</label>
                                <input type="radio" name="categoria" id="v3" value="Bicicletas"><label for="v3">Bicicletas</label>
                                <input type="radio" name="categoria" id="v4" value="Repuestos"><label for="v4">Repuestos</label>
                            </div>
                        </div>
                    </div>

                    <!-- 4. BOTONES -->
                    <div class="d-flex gap-2 mt-4">
                        <a href="{% url 'inicio' %}" class="btn btn-contorno flex-fill text-center">Cancelar</a>
                        <button type="submit" class="btn btn-verde flex-fill">Publicar</button>
                    </div>

                </div>
            </div>

        </div>
    </form>
</main>

<script>
    const input = document.getElementById('imagenes');
    const preview = document.getElementById('preview');
    const vacio = document.getElementById('vacio');
    const miniaturas = document.getElementById('miniaturas');

    input.addEventListener('change', () => {
        const archivos = Array.from(input.files).slice(0, 5);
        miniaturas.innerHTML = '';
        if (!archivos.length) { preview.hidden = true; vacio.hidden = false; return; }

        archivos.forEach((f, i) => {
            const url = URL.createObjectURL(f);
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Foto ' + (i + 1);
            img.addEventListener('click', () => mostrar(img, url));
            miniaturas.appendChild(img);
            if (i === 0) mostrar(img, url);
        });
    });

    function mostrar(img, url) {
        preview.src = url;
        preview.hidden = false;
        vacio.hidden = true;
        miniaturas.querySelectorAll('img').forEach(m => m.classList.remove('activa'));
        img.classList.add('activa');
    }
</script>
</body>
</html>
